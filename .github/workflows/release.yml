name: Release

on:
  push:
    tags:
      # Restrict to v<digit>... so 'vfoo' or 'v-' tags don't trigger a
      # release run. The tag-format validation in "Set MSIX version
      # from tag" still rejects 2-part / 5-part / non-numeric variants.
      - 'v[0-9]*'

permissions:
  contents: write
  # gh pr list (used by "Resolve release-PR head for changelog") reads
  # the closed release/vX.Y.Z PR to locate the release-branch tip. Any
  # explicit permissions: block sets unlisted scopes to none, so this
  # needs to be spelled out.
  pull-requests: read

jobs:
  build:
    runs-on: windows-latest

    # Pre-release tags (anything with a hyphen, e.g. v0.3.0-rc1, v0.3.0-beta1)
    # route through the dev-release Environment which auto-approves.
    # Production tags (v0.3.0) go through the release Environment which can
    # require manual reviewer approval — see .github/RELEASING.md.
    environment:
      name: ${{ contains(github.ref_name, '-') && 'dev-release' || 'release' }}

    steps:
      - name: Checkout GhosttyWin32
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set MSIX version from tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # The appxmanifest Version is a fixed 4-part numeric
          # (Major.Minor.Build.Revision, each 0-65535), so the -rcN
          # suffix can't ride along as text. Encode the channel in
          # Revision instead, keeping upgrade order dev build < rc1 <
          # rc2 < ... < production within one X.Y.Z:
          #
          #   dev build  -> 0.7.0.<commits on dev>   (dev-build.yml, < 65000)
          #   v0.7.0-rc1 -> 0.7.0.65001
          #   v0.7.0-rc2 -> 0.7.0.65002
          #   v0.7.0     -> 0.7.0.65535   (max Revision = "final")
          #
          # MSIX only upgrades in place to a higher version, so this
          # order is what lets a machine on dev builds take an rc, and
          # an rc take production, without an uninstall in between (an
          # uninstall drops taskbar pins). Sideload-only: the Store would
          # require Revision 0, which we don't target.
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
            $revision = 65535
          } elseif ($tag -match '^v(\d+\.\d+\.\d+)-rc(\d+)$') {
            $version = $Matches[1]
            $rc = [int]$Matches[2]
            if ($rc -lt 1 -or $rc -gt 534) {
              Write-Error "Tag '$tag' has rc number $rc, outside the encodable range 1-534."
              exit 1
            }
            $revision = 65000 + $rc
          } else {
            Write-Error "Tag '$tag' is not v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-rc<N>."
            exit 1
          }
          $fullVersion = "$version.$revision"
          "msix_version=$fullVersion" >> $env:GITHUB_OUTPUT
          "release_version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Tag $tag -> MSIX version $fullVersion (release version $version)"

      - name: Build signed MSIX
        id: build
        uses: ./.github/actions/build-signed-msix
        with:
          msix-version: ${{ steps.version.outputs.msix_version }}
          sign: 'true'
          pfx-base64: ${{ secrets.SIGNING_PFX_BASE64 }}
          pfx-password: ${{ secrets.SIGNING_PFX_PASSWORD }}

      # MSIX file naming differs by channel so the two are visually
      # distinguishable in the GitHub Releases asset list and in the
      # scoop bucket:
      #
      #   Production tag v0.3.0          →  Ghostty-0.3.0-x64.msix
      #   Pre-release tag v0.3.0-rc1     →  Ghostty-v0.3.0-rc1-x64.msix
      #
      # Stable keeps the short version (no "v" prefix) for backward
      # compatibility with the existing scoop manifest URL pattern; RC
      # uses the full ref_name so users grabbing the artifact can tell
      # at a glance "this is RC1, not the final v0.3.0".
      - name: Rename MSIX for release
        id: artifact
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:REF_NAME -match '-') {
            # Pre-release: full tag including 'v' prefix and -rcN/-beta suffix
            $renamed = "Ghostty-$env:REF_NAME-x64.msix"
          } else {
            # Production: short version, no 'v' prefix
            $renamed = "Ghostty-$env:RELEASE_VERSION-x64.msix"
          }
          Copy-Item "${{ steps.build.outputs.msix-path }}" $renamed
          Write-Host "Release artifact: $renamed"
          "msix_path=$renamed" >> $env:GITHUB_OUTPUT

      # Pick the previous tag to anchor the auto-generated changelog
      # against: the highest-versioned release tag that is an ANCESTOR
      # of the commit being released.
      #
      # Ancestry is the property that actually matters. GitHub's
      # changelog generation lists the PRs attached to commits the
      # anchor cannot reach, so an anchor that only exists on `main`
      # (a production tag that was never ours-merged back into `dev`)
      # can't reach any of dev's PR-merge history and the notes
      # explode to every PR since the branches diverged — issue #139;
      # v0.5.0-rc1 anchored at v0.4.2 listed 58 PRs instead of 13,
      # and the v0.4.x production notes were silently wrong the same
      # way. Version order alone can't distinguish the good anchors
      # (tags reachable from the release commit) from the bad ones.
      #
      # The ancestor rule reproduces the intent of the old per-case
      # rules by construction:
      #   vX.Y.Z-rcN  -> previous RC on dev, or a production tag that
      #                  the post-release sync recorded into dev
      #   vX.Y.Z      -> previous production tag (RC tags live on dev
      #                  and are not ancestors of main, so they're
      #                  skipped without a special case)
      #
      # If no ancestor tag exists, leave it empty and let GitHub
      # decide (first-release bootstrap case).
      - name: Determine previous tag for changelog
        id: prev
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The checkout above is shallow and tagless; ancestry checks
          # need the full graph.
          #
          # --force is load-bearing: on a tag push actions/checkout
          # plants github.sha (the PEELED commit) at refs/tags/<tag>,
          # while auto-tag-release-pr.yml creates ANNOTATED production
          # tags. The mismatched local tag makes a plain --tags fetch
          # refuse to clobber and exit 1 — and --quiet suppresses the
          # rejection table, so the step dies with no output at all
          # (this killed the v0.6.0 release run). RC tags are
          # lightweight, which is why rc runs never tripped this.
          git fetch --quiet --force --unshallow --tags origin 2>/dev/null \
            || git fetch --quiet --force --tags origin
          prev=""
          while read -r tag; do
            if git merge-base --is-ancestor "$tag" HEAD 2>/dev/null; then
              prev="$tag"
              break
            fi
          done < <(
            gh release list --limit 100 --json tagName --jq '.[] | .tagName' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$' \
              | grep -vx "$REF_NAME" \
              | sort -V -r
          )
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "Previous tag selected: ${prev:-<none>}"

      # Locate the merged release PR (release/vX.Y.Z → main) for
      # production tags so we can point the changelog generator at the
      # release branch tip instead of the squashed merge commit main
      # actually holds. Empty output for RC tags — those are on dev HEAD
      # before any squash, so generate-notes off the tag itself already
      # sees every dev-side PR merge.
      - name: Resolve release-PR head for changelog
        id: relpr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          head_sha=""
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            head_sha=$(gh pr list --state closed \
              --search "head:release/${REF_NAME} base:main" \
              --json headRefOid --jq '.[0].headRefOid // empty')
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Release-PR head SHA: ${head_sha:-<none>}"

      # Generate the changelog body. A production tag cannot reach dev's
      # per-PR history (releases are squashed onto main), so neither it
      # nor the release branch can anchor GitHub's generate-notes: that
      # lists every PR ever merged (#139). Three regimes:
      #
      # Production tags: the merged release PR's body, up to its `---`
      # footer. open-release-pr.yml lists the PRs there from dev, and
      # any summary written into the PR before merging carries over.
      #
      # The first RC after a production release: list the PRs since the
      # dev commit that release was cut from
      # (.github/scripts/prs-since-release.sh). v0.8.2-rc1, anchored at
      # v0.8.1 through generate-notes, listed every PR back to #41.
      #
      # Later RCs: generate-notes from the previous RC, which lives on
      # dev like the target, so the API range is right. Also the
      # fallback when neither of the above finds its baseline.
      - name: Generate release notes body
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          RELPR_HEAD_SHA: ${{ steps.relpr.outputs.head_sha }}
        run: |
          set -euo pipefail
          body=""
          if [[ -n "$RELPR_HEAD_SHA" ]]; then
            pr_body=$(gh pr list --state closed \
              --search "head:release/${REF_NAME} base:main" \
              --json body --jq '.[0].body // empty')
            # Everything above the footer rule; awk reads to the end so
            # the producer never dies of SIGPIPE under pipefail.
            body=$(printf '%s\n' "$pr_body" \
              | awk '{ sub(/\r$/, "") } /^---[[:space:]]*$/ { done = 1 } !done { print }')
            [[ -n "$body" ]] || echo "::warning::Release PR body for ${REF_NAME} is empty; falling back to generate-notes."
          elif [[ -n "$PREV_TAG" && "$PREV_TAG" != *-* ]]; then
            if list=$(bash .github/scripts/prs-since-release.sh "$PREV_TAG" HEAD); then
              body="## What's Changed"$'\n'"$list"
              body+=$'\n\n'"**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${REF_NAME}"
            else
              echo "::warning::No dev-side baseline for ${PREV_TAG}; falling back to generate-notes."
            fi
          fi
          if [[ -z "$body" ]]; then
            args=(--method POST -f "tag_name=$REF_NAME")
            if [[ -n "$PREV_TAG" ]]; then
              args+=(-f "previous_tag_name=$PREV_TAG")
            fi
            body=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              "${args[@]}" --jq '.body')
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$body"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.msix_path }}
            ${{ steps.build.outputs.cer-path }}
          # Tags with a hyphen are pre-releases (rc / beta / alpha).
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Auto-generated changelog (anchored at the tag chosen above)
          # followed by the install instructions. generate_release_notes
          # is deliberately not used so previous_tag_name above takes
          # effect.
          body: |
            ${{ steps.notes.outputs.body }}

            ## Installation

            Signed only with a self-signed publisher certificate (`CN=i999rri`) — an established CA / OSS Foundation signature isn't in place yet (see [#46](https://github.com/${{ github.repository }}/issues/46)), so Windows requires the certificate to be trusted before the MSIX will install. Manual install is the only supported path:

            1. Download `Ghostty.cer` and the `.msix` from the assets above
            2. Trust the certificate (Local Machine → Trusted People store)
            3. Double-click the `.msix` to install

            📖 Detailed steps + troubleshooting: [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md)
