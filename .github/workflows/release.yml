name: Release

on:
  push:
    tags:
      # Restrict to v<digit>... so 'vfoo' or 'v-' tags don't trigger a
      # release run. The tag-format validation in "Set MSIX version
      # from tag" still rejects 2-part / 5-part / non-numeric variants.
      - 'v[0-9]*'

permissions:
  contents: write
  # gh pr list (used by "Resolve release-PR head for changelog") reads
  # the closed release/vX.Y.Z PR to locate the release-branch tip. Any
  # explicit permissions: block sets unlisted scopes to none, so this
  # needs to be spelled out.
  pull-requests: read

jobs:
  build:
    runs-on: windows-latest

    # Pre-release tags (anything with a hyphen, e.g. v0.3.0-rc1, v0.3.0-beta1)
    # route through the dev-release Environment which auto-approves.
    # Production tags (v0.3.0) go through the release Environment which can
    # require manual reviewer approval — see .github/RELEASING.md.
    environment:
      name: ${{ contains(github.ref_name, '-') && 'dev-release' || 'release' }}

    steps:
      - name: Checkout GhosttyWin32
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set MSIX version from tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Tag "vX.Y.Z" -> manifest Version "X.Y.Z.0". Strip any -rcN / -beta
          # suffix because appxmanifest only accepts a four-part numeric.
          $tag = "${{ github.ref_name }}"
          $version = ($tag.TrimStart('v') -split '-')[0]
          # Fail-fast on malformed tags. The MSIX manifest only accepts a
          # 4-part numeric Version, so anything that doesn't reduce to
          # exactly 3 numeric segments here would fail later in obscure
          # ways. Reject up front with a clear message instead.
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' produced version '$version', which is not 3 numeric parts. Expected v<major>.<minor>.<patch> (optional -rcN / -beta suffix)."
            exit 1
          }
          $fullVersion = "$version.0"
          "msix_version=$fullVersion" >> $env:GITHUB_OUTPUT
          "release_version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Tag $tag -> MSIX version $fullVersion (release version $version)"

      - name: Build signed MSIX
        id: build
        uses: ./.github/actions/build-signed-msix
        with:
          msix-version: ${{ steps.version.outputs.msix_version }}
          sign: 'true'
          pfx-base64: ${{ secrets.SIGNING_PFX_BASE64 }}
          pfx-password: ${{ secrets.SIGNING_PFX_PASSWORD }}

      # MSIX file naming differs by channel so the two are visually
      # distinguishable in the GitHub Releases asset list and in the
      # scoop bucket:
      #
      #   Production tag v0.3.0          →  Ghostty-0.3.0-x64.msix
      #   Pre-release tag v0.3.0-rc1     →  Ghostty-v0.3.0-rc1-x64.msix
      #
      # Stable keeps the short version (no "v" prefix) for backward
      # compatibility with the existing scoop manifest URL pattern; RC
      # uses the full ref_name so users grabbing the artifact can tell
      # at a glance "this is RC1, not the final v0.3.0".
      - name: Rename MSIX for release
        id: artifact
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:REF_NAME -match '-') {
            # Pre-release: full tag including 'v' prefix and -rcN/-beta suffix
            $renamed = "Ghostty-$env:REF_NAME-x64.msix"
          } else {
            # Production: short version, no 'v' prefix
            $renamed = "Ghostty-$env:RELEASE_VERSION-x64.msix"
          }
          Copy-Item "${{ steps.build.outputs.msix-path }}" $renamed
          Write-Host "Release artifact: $renamed"
          "msix_path=$renamed" >> $env:GITHUB_OUTPUT

      # Pick the previous tag to anchor the auto-generated changelog
      # against. GitHub's default is "most recent semver tag", which
      # bundles RC iteration noise into the production release notes
      # and ignores production lineage when the next release skips a
      # version. Make the choice explicit instead:
      #
      #   vX.Y.Z-rc1     -> latest production tag (e.g. v0.2.2)
      #   vX.Y.Z-rcN>1   -> previous RC of the same base (vX.Y.Z-rc(N-1))
      #   vX.Y.Z         -> latest production tag (excluding self)
      #
      # If no suitable baseline exists, leave it empty and let GitHub
      # decide (first-release bootstrap case).
      - name: Determine previous tag for changelog
        id: prev
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev=""
          if [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc([0-9]+)$ ]]; then
            base="${BASH_REMATCH[1]}"
            rc_num="${BASH_REMATCH[2]}"
            if [[ "$rc_num" -gt 1 ]]; then
              # RC2+ of the same base: anchor at the previous RC of that
              # same base so the diff covers only the RC-to-RC delta.
              prev=$(gh release list --limit 100 --json tagName \
                --jq ".[] | .tagName | select(startswith(\"v${base}-rc\"))" \
                | grep -vx "$REF_NAME" | sort -V | tail -1 || true)
            fi
            if [[ -z "$prev" ]]; then
              # RC1 (or no earlier RC of the same base): anchor at the
              # tag immediately before this one in version order,
              # regardless of whether it's an RC or production tag.
              # Anchoring blindly at the latest production tag loses
              # every RC tag that landed in between (e.g. v0.3.1-rc1
              # against v0.2.2 instead of v0.3.0-rcN — the v0.3.1-rc1
              # release notes regression).
              #
              # Implementation: collect all release tags, splice in the
              # current ref name so sort -V positions it correctly,
              # then walk forward and remember the line that immediately
              # precedes it.
              prev=$(
                (gh release list --limit 100 --json tagName --jq '.[] | .tagName'; echo "$REF_NAME") \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$' \
                | sort -V \
                | awk -v cur="$REF_NAME" '$0 == cur { exit } { last = $0 } END { print last }'
              )
            fi
          elif [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prev=$(gh release list --limit 100 --json tagName,isPrerelease \
              --jq "[.[] | select(.isPrerelease == false and .tagName != \"$REF_NAME\") | .tagName] | first // \"\"")
          fi
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "Previous tag selected: ${prev:-<none>}"

      # Locate the merged release PR (release/vX.Y.Z → main) for
      # production tags so we can point the changelog generator at the
      # release branch tip instead of the squashed merge commit main
      # actually holds. Empty output for RC tags — those are on dev HEAD
      # before any squash, so generate-notes off the tag itself already
      # sees every dev-side PR merge.
      - name: Resolve release-PR head for changelog
        id: relpr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          head_sha=""
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            head_sha=$(gh pr list --state closed \
              --search "head:release/${REF_NAME} base:main" \
              --json headRefOid --jq '.[0].headRefOid // empty')
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Release-PR head SHA: ${head_sha:-<none>}"

      # Generate the changelog body manually so we can pass
      # previous_tag_name explicitly. softprops/action-gh-release's
      # generate_release_notes: true would call the same API but with
      # GitHub's default baseline.
      #
      # Production tags need a workaround: the tag already exists by the
      # time this workflow runs (we're triggered by its push), so the
      # generate-notes API resolves tag_name → the squashed commit main
      # actually holds and ignores target_commitish. That loses every
      # dev-side PR that landed as an intermediate merge (the release/
      # branch's history) because those commits aren't reachable from
      # main's history. Pass a UNIQUE probe tag_name that doesn't exist,
      # which forces the API to honour target_commitish=<release-PR head>,
      # then rewrite the probe name in the returned body so the
      # "Full Changelog" URL uses the real tag.
      - name: Generate release notes body
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          RELPR_HEAD_SHA: ${{ steps.relpr.outputs.head_sha }}
        run: |
          set -euo pipefail
          args=(--method POST)
          if [[ -n "$RELPR_HEAD_SHA" ]]; then
            probe_tag="${REF_NAME}-notes-probe"
            args+=(-f "tag_name=$probe_tag" -f "target_commitish=$RELPR_HEAD_SHA")
          else
            probe_tag=""
            args+=(-f "tag_name=$REF_NAME")
          fi
          if [[ -n "$PREV_TAG" ]]; then
            args+=(-f "previous_tag_name=$PREV_TAG")
          fi
          body=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${args[@]}" --jq '.body')
          # Undo the probe substitution so the Full Changelog URL points
          # at the real tag.
          if [[ -n "$probe_tag" ]]; then
            body="${body//$probe_tag/$REF_NAME}"
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$body"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.msix_path }}
            ${{ steps.build.outputs.cer-path }}
          # Tags with a hyphen are pre-releases (rc / beta / alpha).
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Auto-generated changelog (anchored at the tag chosen above)
          # followed by the install instructions. generate_release_notes
          # is deliberately not used so previous_tag_name above takes
          # effect.
          body: |
            ${{ steps.notes.outputs.body }}

            ## Installation

            Signed only with a self-signed publisher certificate (`CN=i999rri`)
            — an established CA / OSS Foundation signature isn't in place yet
            (see [#46](https://github.com/${{ github.repository }}/issues/46)),
            so Windows requires the certificate to be trusted before the MSIX
            will install. Manual install is the only supported path:

            1. Download `Ghostty.cer` and the `.msix` from the assets above
            2. Trust the certificate (Local Machine → Trusted People store)
            3. Double-click the `.msix` to install

            📖 Detailed steps + troubleshooting:
            [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md)
