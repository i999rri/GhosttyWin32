name: Release

on:
  push:
    tags:
      # Restrict to v<digit>... so 'vfoo' or 'v-' tags don't trigger a
      # release run. The tag-format validation in "Set MSIX version
      # from tag" still rejects 2-part / 5-part / non-numeric variants.
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # Pre-release tags (anything with a hyphen, e.g. v0.3.0-rc1, v0.3.0-beta1)
    # route through the dev-release Environment which auto-approves.
    # Production tags (v0.3.0) go through the release Environment which can
    # require manual reviewer approval — see .github/RELEASING.md.
    environment:
      name: ${{ contains(github.ref_name, '-') && 'dev-release' || 'release' }}

    steps:
      - name: Checkout GhosttyWin32
        uses: actions/checkout@v4

      - name: Set MSIX version from tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Tag "vX.Y.Z" -> manifest Version "X.Y.Z.0". Strip any -rcN / -beta
          # suffix because appxmanifest only accepts a four-part numeric.
          $tag = "${{ github.ref_name }}"
          $version = ($tag.TrimStart('v') -split '-')[0]
          # Fail-fast on malformed tags. The MSIX manifest only accepts a
          # 4-part numeric Version, so anything that doesn't reduce to
          # exactly 3 numeric segments here would fail later in obscure
          # ways. Reject up front with a clear message instead.
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' produced version '$version', which is not 3 numeric parts. Expected v<major>.<minor>.<patch> (optional -rcN / -beta suffix)."
            exit 1
          }
          $fullVersion = "$version.0"
          "msix_version=$fullVersion" >> $env:GITHUB_OUTPUT
          "release_version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Tag $tag -> MSIX version $fullVersion (release version $version)"

      - name: Build signed MSIX
        id: build
        uses: ./.github/actions/build-signed-msix
        with:
          msix-version: ${{ steps.version.outputs.msix_version }}
          sign: 'true'
          pfx-base64: ${{ secrets.SIGNING_PFX_BASE64 }}
          pfx-password: ${{ secrets.SIGNING_PFX_PASSWORD }}

      - name: Rename MSIX for release
        id: artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $renamed = "Ghostty-${{ steps.version.outputs.release_version }}-x64.msix"
          Copy-Item "${{ steps.build.outputs.msix-path }}" $renamed
          Write-Host "Release artifact: $renamed"
          "msix_path=$renamed" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.msix_path }}
            ${{ steps.build.outputs.cer-path }}
          generate_release_notes: true
          # Tags with a hyphen are pre-releases (rc / beta / alpha).
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Installation

            ### Scoop (recommended)
            ```
            scoop install ghostty
            ```

            ### Manual install
            1. Download `Ghostty.cer` and `Ghostty-${{ steps.version.outputs.release_version }}-x64.msix`
            2. Trust the certificate (Local Machine → Trusted People store)
            3. Double-click the `.msix` to install

            📖 Detailed steps + troubleshooting:
            [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md)
