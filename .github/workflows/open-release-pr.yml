name: Open release PR

# Builds a "release/vX.Y.Z" branch as `main` plus one squash commit of
# `dev` and opens a PR against `main`. Triggered manually from the
# Actions tab when ready to ship a production release.
#
# The branch is deliberately NOT a snapshot of dev HEAD: main only ever
# receives squash commits, so dev's individual commits are never its
# ancestors and a snapshot branch drags the whole accumulated dev
# history into the PR's commit list (every release PR showed 100+
# commits). Squashing here keeps the PR at main + 1 commit while the
# tree stays identical to dev HEAD.
#
# RC tags (vX.Y.Z-rcN) are intentionally NOT supported here — they're
# created with `git tag` directly on `dev` per the model in
# .github/RELEASING.md. This workflow only handles the dev → main
# promotion that yields a production semver tag.
#
# After merge, .github/workflows/auto-tag-release-pr.yml picks up the
# release/v* head ref and tags `main` HEAD, which fires release.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (例: 0.3.0、production のみ。"v" は付けない、ハイフン suffix も不可)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' must be plain semver (X.Y.Z, no 'v' prefix, no hyphen suffix)."
            echo "::error::RC tags are made manually on dev — see .github/RELEASING.md."
            exit 1
          fi

      - name: Create release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/v$VERSION"

          # Refuse if any release/* PR is already open against main —
          # we only run one release at a time so the auto-tag workflow
          # has an unambiguous target.
          existing=$(gh pr list --base main --search "head:release/" --state open --json number --jq 'length')
          if [[ "$existing" -gt 0 ]]; then
            echo "::error::An open release/* PR already exists. Close or merge it first."
            exit 1
          fi

          # Refuse if the branch is already on the remote (could be from
          # a previous abandoned attempt — let the operator clean up
          # explicitly rather than silently overwriting).
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists on origin. Delete it (gh api -X DELETE) before retrying."
            exit 1
          fi

          # Build the branch as main + one squash commit of dev (see the
          # header comment for why). The post-release sync keeps dev a
          # superset of main, so the squash merge is conflict-free; if
          # main ever gains a commit dev doesn't have, this step fails
          # loudly and the operator reconciles first. From this point
          # the branch is frozen — dev can keep moving.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -b "$BRANCH" origin/main
          git merge --squash origin/dev
          git commit -m "Release v$VERSION"
          git push origin "$BRANCH"
          echo "Pushed branch $BRANCH at $(git rev-parse --short HEAD) (tree of dev $(git rev-parse --short origin/dev))"

      - name: Generate change list
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Pick the most recent production release as the "previous"
          # baseline. Filtering on isPrerelease=false excludes both RC
          # tags (vX.Y.Z-rcN) and the rolling `dev-build` release.
          prev_tag=$(gh release list --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease == false) | .tagName] | first // ""')

          # Enumerate the PRs ourselves instead of calling the
          # generate-notes API anchored at $prev_tag: that tag points
          # at a squash commit on main which cannot reach dev's
          # per-PR merge commits, so the API lists every PR since
          # squash releases began (issue #139's PR-body sibling; the
          # v0.6.0 release PR opened with 70 entries back to #41).
          # The correct baseline is the previous release PR's
          # dev-side head — walk first-parent from there to HEAD and
          # collect the squash subjects' (#N) suffixes.
          prev_head=""
          if [[ -n "$prev_tag" ]]; then
            prev_head=$(gh pr list --state closed \
              --search "head:release/${prev_tag} base:main" \
              --json headRefOid --jq '.[0].headRefOid // empty')
          fi

          if [[ -n "$prev_head" ]]; then
            # Walk dev, not the release branch: the branch is main + one
            # squash commit, so the per-PR history only exists on dev.
            echo "Enumerating PRs in $prev_head..origin/dev (since $prev_tag)"
            notes="## What's Changed"
            for n in $(git log --first-parent --format='%s' "$prev_head..origin/dev" \
                | grep -oE '\(#[0-9]+\)$' | tr -d '(#)' | sort -n || true); do
              notes+=$'\n'"$(gh pr view "$n" --json number,title,author --jq \
                '"* \(.title) by @\(.author.login) in https://github.com/'"${GITHUB_REPOSITORY}"'/pull/\(.number)"')"
            done
            notes+=$'\n\n'"**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...v${VERSION}"
          elif [[ -n "$prev_tag" ]]; then
            echo "No release PR found for $prev_tag — falling back to generate-notes."
            notes=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              --method POST \
              -f tag_name="v$VERSION" \
              -f target_commitish="release/v$VERSION" \
              -f previous_tag_name="$prev_tag" \
              --jq '.body')
          else
            echo "No previous production release found — bootstrap mode."
            notes="(No previous production release found. This is the first one.)"
          fi

          # multi-line outputs need a heredoc-style delimiter.
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ steps.changes.outputs.notes }}
        run: |
          set -euo pipefail
          BRANCH="release/v$VERSION"

          body=$(cat <<EOM
          ## What's in this release

          $NOTES

          ---

          このブランチは \`main\` に \`dev\` との差分を 1 commit に畳んで載せたもの (tree は \`dev\` HEAD と同一)。マージで自動的に
          \`v$VERSION\` タグが \`main\` に打たれて \`release.yml\` が走る。

          See [.github/RELEASING.md](.github/RELEASING.md) for the full release procedure.
          EOM
          )

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release v$VERSION" \
            --body "$body"
