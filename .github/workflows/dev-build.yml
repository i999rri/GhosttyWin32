name: Dev Build

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: write

# Run-coalescing: only one dev-build is meaningful at a time. If a newer
# push arrives while the previous build is still going, cancel the older
# one so we don't overwrite a newer artifact with an older one.
concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    # Same Environment as pre-release tags. Auto-approves; only the production
    # `release` Environment requires reviewer approval.
    environment: dev-release

    steps:
      - name: Checkout GhosttyWin32
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute dev version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # MSIX manifest Version is X.Y.Z.W (each part is UInt16, max 65535).
          # We use 0.3.0.<run_number> so each CI build is monotonically
          # increasing within a base version. Bump $base manually before
          # cutting a real v0.3.0 production tag so dev-builds for the next
          # cycle (0.4.x) don't collide.
          $base = "0.3.0"
          $runNumber = "${{ github.run_number }}"
          $msixVersion = "$base.$runNumber"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $today = (Get-Date).ToString("yyyy-MM-dd")
          $displayVersion = "dev-$today-$shortSha"

          "msix_version=$msixVersion" >> $env:GITHUB_OUTPUT
          "display_version=$displayVersion" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          Write-Host "MSIX manifest Version : $msixVersion"
          Write-Host "Display version       : $displayVersion"

      - name: Build signed MSIX
        id: build
        uses: ./.github/actions/build-signed-msix
        with:
          msix-version: ${{ steps.version.outputs.msix_version }}
          sign: 'true'
          pfx-base64: ${{ secrets.SIGNING_PFX_BASE64 }}
          pfx-password: ${{ secrets.SIGNING_PFX_PASSWORD }}

      - name: Rename MSIX for dev release
        id: artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $renamed = "Ghostty-dev-x64.msix"
          Copy-Item "${{ steps.build.outputs.msix-path }}" $renamed
          "msix_path=$renamed" >> $env:GITHUB_OUTPUT

      # Replace the dev-build release in-place. Deleting the old release first
      # gives us a clean slate — softprops/action-gh-release otherwise appends
      # assets which would pile up across runs. We swallow errors so the very
      # first run (no prior release) doesn't fail.
      - name: Delete previous dev-build release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This step intentionally swallows errors: on the very first run
          # there's no `dev-build` release to delete, so gh exits non-zero.
          # We use try/catch (with strict preferences set) instead of the
          # old `$LASTEXITCODE = 0` reset trick which is brittle once
          # PSNativeCommandUseErrorActionPreference is on globally.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          try {
            gh release delete dev-build --yes --cleanup-tag 2>$null
            Write-Host "Deleted previous dev-build release."
          } catch {
            Write-Host "No previous dev-build release to delete (first run or already gone)."
          }

      - name: Create dev-build release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $shortSha = "${{ steps.version.outputs.short_sha }}"
          $now = Get-Date -Format 'yyyy-MM-dd HH:mm UTC'
          $repo = "${{ github.repository }}"
          $runId = "${{ github.run_id }}"
          $runNum = "${{ github.run_number }}"
          $sha = "${{ github.sha }}"
          $msixVer = "${{ steps.version.outputs.msix_version }}"

          # Build the release notes as an array of lines and write to a file.
          # PowerShell here-strings (@"..."@) require the closing "@ at column 0,
          # which YAML's `run: |` block scalar can't satisfy because every line
          # in the block needs indenting. Building line-by-line avoids the
          # conflict entirely.
          $bt = [char]0x60   # backtick — used in markdown as code delimiter
          $lines = @(
            "**Dev build** — automated build of the latest ${bt}dev${bt} branch.",
            "",
            "⚠️ This is **not** a stable release. Expect bugs.",
            "",
            "## Install",
            "",
            "1. Download ${bt}Ghostty-dev-x64.msix${bt} and ${bt}Ghostty.cer${bt}",
            "2. Trust the certificate (Local Machine → Trusted People store)",
            "3. Double-click the ${bt}.msix${bt} to install",
            "",
            "If you previously installed Ghostty (stable or dev), this MSIX upgrades it in place.",
            "",
            "📖 Detailed steps + troubleshooting: [docs/INSTALL.md](https://github.com/${repo}/blob/main/docs/INSTALL.md)",
            "",
            "## Source",
            "",
            "| | |",
            "|---|---|",
            "| Branch | ${bt}dev${bt} |",
            "| Commit | [${bt}${shortSha}${bt}](https://github.com/${repo}/commit/${sha}) |",
            "| Build  | [#${runNum}](https://github.com/${repo}/actions/runs/${runId}) |",
            "| MSIX version | ${bt}${msixVer}${bt} |",
            "| Built | ${now} |"
          )
          $lines | Set-Content -Path release-notes.md -Encoding utf8

          gh release create dev-build `
            --title "Dev build (${{ steps.version.outputs.display_version }})" `
            --notes-file release-notes.md `
            --prerelease `
            "${{ steps.artifact.outputs.msix_path }}" `
            "${{ steps.build.outputs.cer-path }}"
