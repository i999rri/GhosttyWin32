name: CI

# Verification on every PR: the same build pipeline as Dev Build /
# Release without signing or publishing, then the unit tests. The build
# catches breakages (e.g. /std:c++17 vs c++20 mismatches); the tests
# catch a rule changed in one place and asserted in another, which has
# reached dev before now.
on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel an older in-flight run on the same ref when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout GhosttyWin32
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build MSIX (unsigned)
        uses: ./.github/actions/build-signed-msix
        with:
          # Placeholder version — PR builds don't publish the MSIX, so
          # the value only matters insofar as the manifest patcher needs
          # a syntactically valid 4-part number.
          msix-version: '0.0.0.0'
          sign: 'false'

      # After the action, which has already set up MSBuild, restored
      # this project's packages and built ghostty.dll. What is left is
      # Core and the gtest binary that links it, which is quick.
      #
      # SolutionDir is passed because the project does not set OutDir
      # and the default is $(SolutionDir)$(Platform)\$(Configuration)\.
      # Building a vcxproj on its own leaves SolutionDir pointing at the
      # project's own directory, so the EXE would land under Tests\
      # instead of where the solution puts it.
      - name: Build the tests
        shell: pwsh
        run: >
          msbuild Tests\Tests.vcxproj -m
          -p:Configuration=Release -p:Platform=x64
          -p:SolutionDir=$env:GITHUB_WORKSPACE\

      # The suite covers what needs no WinRT running: the wsl command
      # line, the shim protocol, the pipe names, the action dispatch.
      - name: Run the tests
        shell: pwsh
        run: .\x64\Release\Tests.exe
